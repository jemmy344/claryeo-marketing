; ─── Production PHP-FPM pool ──────────────────────────────────────────────
[www]
user  = www-data
group = www-data

listen       = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data

; Dynamic PM sized for a 512 MB container (~10 MB per worker)
pm                   = dynamic
pm.max_children      = 50
pm.start_servers     = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.max_requests      = 500

; Health/monitoring endpoints (checked by Nginx / load-balancer)
pm.status_path = /fpm-status
ping.path      = /fpm-ping

access.log              = /proc/self/fd/2
catch_workers_output    = yes
decorate_workers_output = no
