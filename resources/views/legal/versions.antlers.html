{{ partial:shell }}
    <article class="mx-auto max-w-3xl px-6 py-16">
        <header class="mb-10 border-b border-zinc-100 pb-6">
            <h1 class="text-3xl font-semibold tracking-tight text-zinc-900">{{ title }} &mdash; versions</h1>
            <p class="mt-2 text-sm"><a href="/{{ slug }}" class="text-zinc-500 underline hover:text-zinc-900">Back to current version</a></p>
        </header>
        <ul class="divide-y divide-zinc-100">
            {{ versions }}
                <li class="flex items-center justify-between py-4">
                    <a href="{{ url }}" class="font-medium text-zinc-900 hover:underline">Version {{ version }}</a>
                    <span class="flex items-center gap-3 text-sm text-zinc-500">
                        {{ if effective_date }}<span>{{ effective_date }}</span>{{ /if }}
                        {{ if version == current_version }}<span class="rounded-full bg-emerald-50 px-2 py-0.5 text-xs font-medium text-emerald-700">Current</span>{{ /if }}
                    </span>
                </li>
            {{ /versions }}
        </ul>
    </article>
{{ /partial:shell }}
