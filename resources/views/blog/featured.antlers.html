{{#
    The lead entry. No frame -- the image and the type carry it, so the newest
    post reads as the front page rather than as the first of six cards.
#}}
<article class="group">
    {{ if hero_image }}
        <a href="{{ url }}" class="block overflow-hidden rounded-lg">
            <img
                src="{{ hero_image }}"
                alt="{{ title }}"
                class="aspect-[16/9] w-full object-cover transition-transform duration-500 group-hover:scale-[1.02]"
            >
        </a>
    {{ /if }}

    <p class="mt-5 t-label text-muted-foreground">
        {{ date format="d M Y" }} <span class="text-border">·</span> {{ author }}
    </p>

    <h2 class="t-display-3 mt-2 text-foreground">
        <a href="{{ url }}" class="transition-colors group-hover:text-primary">{{ title }}</a>
    </h2>

    {{ if excerpt }}
        <p class="t-body mt-3 max-w-xl text-muted-foreground">{{ excerpt }}</p>
    {{ /if }}
</article>
