<a href="{{ url }}" class="group flex items-center gap-4 overflow-hidden rounded-2xl border border-border bg-card p-4 shadow-sm transition-colors hover:border-primary/20">
    {{ if hero_image }}
        <div class="h-16 w-[5.75rem] shrink-0 overflow-hidden rounded-lg bg-muted md:h-[4.25rem] md:w-[6.25rem]">
            <img src="{{ hero_image }}" alt="{{ title }}" loading="lazy" class="h-full w-full object-cover">
        </div>
    {{ /if }}
    <div class="min-w-0 flex-1">
        <h3 class="text-sm font-semibold leading-snug text-foreground transition-colors group-hover:text-primary md:text-[0.9375rem]">{{ title }}</h3>
        <p class="mt-2 text-xs text-muted-foreground">{{ date format="F j, Y" }} &middot; <span class="text-primary">{{ author }}</span></p>
    </div>
</a>
