<article data-blog-card class="group flex flex-col overflow-hidden rounded-2xl border border-border bg-card shadow-sm transition-all hover:-translate-y-0.5 hover:border-primary/30 hover:shadow-md" data-search="{{ title | lower }} {{ excerpt | lower }} {{ author | lower }}">
    <a href="{{ url }}" class="relative block overflow-hidden">
        {{ if hero_image }}
            <img src="{{ hero_image }}" alt="{{ title }}" loading="lazy" class="aspect-[16/10] w-full object-cover transition-transform duration-300 group-hover:scale-105">
        {{ else }}
            <div class="aspect-[16/10] bg-muted"></div>
        {{ /if }}
        {{ if categories }}
            <div class="absolute inset-x-0 bottom-0 flex flex-wrap gap-1.5 bg-gradient-to-t from-black/50 to-transparent p-4 pt-10">
                {{ categories }}
                    <span class="rounded-full bg-white/95 px-2.5 py-0.5 text-xs font-medium text-primary">{{ title }}</span>
                {{ /categories }}
            </div>
        {{ /if }}
    </a>
    <div class="flex flex-1 flex-col p-5 md:p-6">
        <p class="text-xs text-muted-foreground">{{ date format="F j, Y" }}</p>
        <h2 class="mt-2 text-lg font-semibold leading-snug tracking-tight text-foreground">
            <a href="{{ url }}" class="transition-colors group-hover:text-primary">{{ title }}</a>
        </h2>
        {{ if excerpt }}
            <p class="mt-2 line-clamp-3 flex-1 text-sm leading-relaxed text-muted-foreground">{{ excerpt }}</p>
        {{ /if }}
        <a href="{{ url }}" class="mt-4 inline-flex text-sm font-medium text-primary transition-colors hover:text-primary/80">Read More</a>
    </div>
</article>
