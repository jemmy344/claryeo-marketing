<a href="{{ url }}" class="group flex flex-col overflow-hidden rounded-2xl border border-border bg-card shadow-sm transition-all hover:-translate-y-0.5 hover:border-primary/40 hover:shadow-lg">
    {{ if hero_image }}
        <div class="aspect-[16/9] overflow-hidden bg-muted">
            <img src="{{ hero_image }}" alt="{{ title }}" loading="lazy" class="h-full w-full object-cover transition-transform group-hover:scale-105">
        </div>
    {{ /if }}
    <div class="flex flex-1 flex-col p-6">
        <div class="flex flex-wrap gap-2">
            {{ categories }}<span class="rounded-full bg-primary-surface px-2.5 py-0.5 text-xs font-medium text-primary-surface-foreground">{{ title }}</span>{{ /categories }}
        </div>
        <h2 class="mt-3 text-lg font-semibold tracking-tight text-foreground">{{ title }}</h2>
        <p class="mt-2 flex-1 text-sm text-muted-foreground">{{ excerpt }}</p>
        <p class="mt-4 text-xs text-muted-foreground">{{ author }} &middot; {{ date format="j F Y" }}</p>
    </div>
</a>
