title: Post
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              display: Title
          -
            handle: excerpt
            field:
              type: textarea
              display: Excerpt
              instructions: 'One or two sentences shown on the blog index and in social previews.'
          -
            handle: hero_image
            field:
              type: text
              display: 'Hero image URL'
              instructions: 'Absolute image URL (e.g. a Pexels CDN link).'
          -
            handle: author
            field:
              type: text
              display: Author
              default: 'The Claryeo team'
          -
            handle: content
            field:
              type: markdown
              display: Content
              required: true
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: categories
            field:
              type: terms
              taxonomies:
                - categories
              display: Categories
              mode: select
